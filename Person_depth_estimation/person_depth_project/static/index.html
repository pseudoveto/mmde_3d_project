<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Person Depth</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #66707c;
    --border: #dde1e6; --accent: #2f6fed; --warn: #b26a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1b1e23; --text: #e7eaee; --muted: #9aa3ad;
      --border: #2c3138; --accent: #5b8fff; --warn: #f0a83a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  h1 { font-size: 17px; margin: 0 12px 0 0; }
  button, .file-btn {
    font: inherit; padding: 7px 14px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #fileName { color: var(--muted); }
  #status { margin-left: auto; color: var(--muted); }
  #status.error { color: #d33; }

  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px;
    padding: 20px; max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 16px; } }

  .viewer {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    min-height: 420px; display: flex; flex-direction: column; overflow: hidden;
  }
  .tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--border); }
  .tabs button { border: none; padding: 5px 12px; }
  .tabs button.active { background: var(--bg); font-weight: 600; }
  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px;
  }
  .stage img { max-width: 100%; max-height: 78vh; border-radius: 6px; }
  .placeholder { color: var(--muted); text-align: center; }

  aside {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; align-self: start;
  }
  aside h2 { font-size: 15px; margin: 0 0 12px; }
  .person {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .face {
    width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none;
    border: 3px solid; box-sizing: border-box;
  }
  .pid { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dist {
    margin-left: auto; font-size: 18px; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .sub { color: var(--muted); font-size: 12px; }
  .warn { color: var(--warn); font-size: 12px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>Person Depth</h1>
  <label class="file-btn">Choose image
    <input id="file" type="file" accept="image/*,.heic,.heif" hidden>
  </label>
  <span id="fileName">No file selected</span>
  <button id="run" class="primary" disabled>Run</button>
  <span id="status"></span>
</header>

<main>
  <section class="viewer">
    <div class="tabs">
      <button data-view="overlay" class="active">Masked</button>
      <button data-view="depth">Depth</button>
      <button data-view="original">Original</button>
    </div>
    <div class="stage" id="stage">
      <div class="placeholder">Upload an image and press Run</div>
    </div>
  </section>

  <aside>
    <h2 id="countTitle">People</h2>
    <div id="people" class="sub">No results yet.</div>
    <div id="meta" class="meta"></div>
  </aside>
</main>

<script>
  const fileInput = document.getElementById("file");
  const runBtn = document.getElementById("run");
  const statusEl = document.getElementById("status");
  const stage = document.getElementById("stage");
  const peopleEl = document.getElementById("people");
  const views = { overlay: null, depth: null, original: null };
  let current = "overlay";

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  function show(view) {
    current = view;
    document.querySelectorAll(".tabs button").forEach(b =>
      b.classList.toggle("active", b.dataset.view === view));
    const src = views[view] || views.original;
    stage.innerHTML = src ? `<img src="${src}" alt="${view}">`
                          : `<div class="placeholder">Upload an image and press Run</div>`;
  }
  document.querySelectorAll(".tabs button").forEach(b =>
    b.addEventListener("click", () => show(b.dataset.view)));

  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    document.getElementById("fileName").textContent = f ? f.name : "No file selected";
    runBtn.disabled = !f;
    views.overlay = views.depth = null;
    if (views.original) URL.revokeObjectURL(views.original);
    views.original = f ? URL.createObjectURL(f) : null;  // HEIC won't preview, that's fine
    show("original");
  });

  // BGR from the server -> CSS rgb()
  const cssColor = ([b, g, r]) => `rgb(${r}, ${g}, ${b})`;

  function renderPeople(data) {
    document.getElementById("countTitle").textContent =
      `${data.num_people} ${data.num_people === 1 ? "person" : "people"} detected`;
    if (!data.people.length) {
      peopleEl.innerHTML = `<div class="sub">Nobody found in this image.</div>`;
    } else {
      peopleEl.innerHTML = data.people.map(p => {
        const d = p.distance_m ?? p.z_depth_m;
        const color = cssColor(p.color_bgr);
        return `
          <div class="person">
            <img class="face" src="${p.face_jpg}" alt="${p.id} face" style="border-color:${color}">
            <div>
              <div class="pid"><span class="swatch" style="background:${color}"></span>${p.id}</div>
              <div class="sub">Z-depth ${p.z_depth_m ?? "–"} m · conf ${p.detection_conf}</div>
              ${p.low_reliability ? `<div class="warn">⚠ low reliability</div>` : ""}
            </div>
            <span class="dist">${d != null ? d.toFixed(2) + " m" : "–"}</span>
          </div>`;
      }).join("");
    }
    const t = data.timings;
    document.getElementById("meta").textContent =
      `Segmentation ${t.segmentation_s}s · depth ${t.depth_s}s · intrinsics ${data.intrinsics_source}`;
  }

  runBtn.addEventListener("click", async () => {
    const f = fileInput.files[0];
    if (!f) return;
    runBtn.disabled = true;
    setStatus("Processing…");
    try {
      const body = new FormData();
      body.append("file", f);
      const res = await fetch("/predict", { method: "POST", body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      views.overlay = data.overlay_png;
      views.depth = data.depth_png;
      renderPeople(data);
      show("overlay");
      setStatus("Done");
    } catch (e) {
      setStatus("Error: " + e.message, true);
    } finally {
      runBtn.disabled = false;
    }
  });
</script>
</body>
</html>
